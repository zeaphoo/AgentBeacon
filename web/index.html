<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
      ;(function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('agent-beacon.prefs') || '{}')
          var theme = prefs.theme
          if (theme !== 'system' && theme !== 'light' && theme !== 'dark') {
            theme = 'system'
          }
          var resolvedTheme =
            theme === 'system'
              ? window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : theme
          document.documentElement.dataset.theme = resolvedTheme
          document.documentElement.style.colorScheme = resolvedTheme
          var themeMeta = document.querySelector('meta[name="theme-color"]')
          if (themeMeta) {
            themeMeta.setAttribute(
              'content',
              resolvedTheme === 'light' ? '#f7faf9' : '#0b0f14',
            )
          }

          var language = prefs.language
          if (language !== 'zh' && language !== 'en') {
            var tag =
              (navigator.languages && navigator.languages[0]) ||
              navigator.language ||
              'en'
            language = String(tag).toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en'
          }
          document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en'
        } catch (error) {
          /* Preferences are optional; keep the defaults on failure. */
        }
      })()
    </script>
    <title>AgentBeacon</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
