[workspace]
resolver = "2"
members = [
    "crates/agent-beacon-core",
    "crates/agent-beacon-lights",
    "crates/agent-beacon",
    "desktop/src-tauri",
]

[workspace.package]
version = "0.2.0-rc.1"
edition = "2021"
license = "Apache-2.0"
authors = ["AgentBeacon contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
