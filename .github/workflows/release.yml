name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check manifests and tag
        id: version
        run: |
          set -euo pipefail
          version="$(./scripts/check-versions.sh)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version v${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release version: ${version}"

  linux:
    name: Linux packages
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            patchelf \
            file \
            libudev-dev \
            libusb-1.0-0-dev
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build packages
        run: bash scripts/package-linux-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/linux/*
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Check macOS signing secrets
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MAC_NOTARY_API_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.MAC_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          missing=()
          [[ -z "$P12" ]] && missing+=("MAC_CERT_P12_BASE64")
          [[ -z "$PASSWORD" ]] && missing+=("MAC_CERT_PASSWORD")
          [[ -z "$IDENTITY" ]] && missing+=("MAC_SIGN_IDENTITY")
          [[ -z "$NOTARY_KEY_ID" ]] && missing+=("MAC_NOTARY_API_KEY_ID")
          [[ -z "$NOTARY_ISSUER_ID" ]] && missing+=("MAC_NOTARY_API_ISSUER_ID")
          [[ -z "$NOTARY_KEY_P8" ]] && missing+=("MAC_NOTARY_API_KEY_P8_BASE64")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::missing macOS signing/notarization secrets: ${missing[*]}"
            exit 1
          fi
      - name: Import signing identity into temporary keychain
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/agent-beacon-signing.keychain-db"
          keychain_pass="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pass" "$keychain" >/dev/null
          security list-keychains -d user | tr -d '"' | \
            xargs security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build and sign app
        env:
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: bash scripts/package-mac.sh
      - name: Verify signature
        run: |
          set -euo pipefail
          app="target/release/bundle/macos/AgentBeacon.app"
          [[ -d "$app" ]] || { echo "missing $app" >&2; exit 1; }
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Authority|flags='
      - name: Notarize and staple dmg
        env:
          MAC_NOTARY_API_KEY_ID: ${{ secrets.MAC_NOTARY_API_KEY_ID }}
          MAC_NOTARY_API_ISSUER_ID: ${{ secrets.MAC_NOTARY_API_ISSUER_ID }}
          MAC_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MAC_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$MAC_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$key"
          shopt -s nullglob
          dmgs=(dist/mac/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "::error::expected exactly one dmg, found ${#dmgs[@]}"
            exit 1
          fi
          dmg="${dmgs[0]}"
          xcrun notarytool submit "$dmg" --key "$key" \
            --key-id "$MAC_NOTARY_API_KEY_ID" \
            --issuer "$MAC_NOTARY_API_ISSUER_ID" --wait
          stapler_retry() {
            local action="$1"
            local target="$2"
            local attempt=1
            until xcrun stapler "$action" "$target"; do
              if (( attempt >= 4 )); then
                return 1
              fi
              echo "stapler $action failed (attempt $attempt); retrying in 20s" >&2
              sleep 20
              attempt=$((attempt + 1))
            done
          }
          stapler_retry staple "$dmg"
          stapler_retry validate "$dmg"
          rm -f "$key"
      - name: Remove notary key
        if: always()
        run: rm -f "$RUNNER_TEMP/notary-key.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/mac/*.dmg
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/agent-beacon-signing.keychain-db" 2>/dev/null || true

  windows:
    name: Windows packages
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-2022
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build packages
        shell: bash
        run: bash scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/windows/*.exe
            dist/windows/*.msi
            dist/windows/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify, linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.zip' \) \
            -exec cp -v {} release/ \;
          ls -lh release
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AgentBeacon v${{ needs.verify.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: release/*
